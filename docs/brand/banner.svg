<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="SplitSlip — Scan. Split. Settle.">
  <title>SplitSlip — Scan. Split. Settle.</title>

  <defs>
    <!-- Newsprint grain, same trick the app uses -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="card">
      <rect x="0" y="0" width="1280" height="440" rx="4"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- Warm paper ground -->
    <rect width="1280" height="440" fill="#F0EEE6"/>
    <rect width="1280" height="440" filter="url(#grain)" opacity="0.06"/>

    <!-- Perforated top edge -->
    <g fill="#F0EEE6" stroke="#D8D4C8" stroke-width="1.5">
      <path d="M0 26 H1280" stroke-dasharray="7 5" fill="none"/>
    </g>

    <!-- ───────── Left: wordmark and tagline ───────── -->
    <g transform="translate(88 122)">
      <!-- Overline -->
      <text font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15"
            letter-spacing="6.5" fill="#8B8C83">SCAN · SPLIT · SETTLE</text>

      <!-- Wordmark -->
      <text y="88" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif"
            font-size="94" font-weight="800" letter-spacing="-3" fill="#20211F">SplitSlip</text>

      <!-- Rule -->
      <path d="M2 118 H392" stroke="#20211F" stroke-width="2"/>
      <path d="M2 125 H392" stroke="#20211F" stroke-width="1"/>

      <!-- Tagline -->
      <text y="164" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif"
            font-size="23" fill="#55564F">Split the bill. Not the friendship.</text>
      <text y="199" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif"
            font-size="17" fill="#8B8C83">Item-level splits, paisa-exact, collected over UPI.</text>
    </g>

    <!-- ───────── Right: receipt on the desk ───────── -->
    <g transform="translate(792 54) rotate(-1.6)">
      <!-- Paper -->
      <path d="M0 0 H300 V300
               l-12.5 -13 -12.5 13 -12.5 -13 -12.5 13 -12.5 -13 -12.5 13
               -12.5 -13 -12.5 13 -12.5 -13 -12.5 13 -12.5 -13 -12.5 13
               -12.5 -13 -12.5 13 -12.5 -13 -12.5 13 -12.5 -13 -12.5 13
               -12.5 -13 -12.5 13 -12.5 -13 -12.5 13 -12.5 -13 Z"
            fill="#FAF9F4" stroke="#20211F" stroke-width="1.5"/>

      <g font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#20211F">
        <text x="150" y="38" font-size="15" font-weight="600" letter-spacing="3.5"
              text-anchor="middle">THE TABLE</text>
        <text x="150" y="58" font-size="10" letter-spacing="3" fill="#8B8C83"
              text-anchor="middle">BANGALORE · TABLE 12</text>

        <path d="M22 74 H278" stroke="#D8D4C8" stroke-width="1.5" stroke-dasharray="5 4"/>

        <g font-size="12.5">
          <text x="22" y="100">2 × Butter Chicken</text>
          <text x="278" y="100" text-anchor="end">480.00</text>
          <text x="22" y="124">1 × Paneer Tikka</text>
          <text x="278" y="124" text-anchor="end">360.00</text>
          <text x="22" y="148">4 × Butter Naan</text>
          <text x="278" y="148" text-anchor="end">160.00</text>
          <text x="22" y="172">1 × Biryani</text>
          <text x="278" y="172" text-anchor="end">420.00</text>
          <text x="22" y="196" fill="#55564F">GST 18%</text>
          <text x="278" y="196" text-anchor="end" fill="#55564F">255.60</text>
        </g>

        <path d="M22 212 H278" stroke="#D8D4C8" stroke-width="1.5" stroke-dasharray="5 4"/>

        <text x="22" y="238" font-size="14" font-weight="600" letter-spacing="2">TOTAL</text>
        <text x="278" y="238" font-size="16" font-weight="700" text-anchor="end">₹1,675.60</text>

        <text x="22" y="262" font-size="10.5" letter-spacing="2" fill="#8B8C83">SPLIT 4 WAYS</text>
        <text x="278" y="262" font-size="10.5" letter-spacing="2" text-anchor="end" fill="#274D40">₹418.90 EACH</text>
      </g>

      <!-- Barcode strip -->
      <g fill="#20211F">
        <rect x="22" y="274" width="3" height="14"/><rect x="28" y="274" width="1.5" height="14"/>
        <rect x="33" y="274" width="4" height="14"/><rect x="40" y="274" width="1.5" height="14"/>
        <rect x="45" y="274" width="2.5" height="14"/><rect x="51" y="274" width="4" height="14"/>
        <rect x="58" y="274" width="1.5" height="14"/><rect x="63" y="274" width="3" height="14"/>
        <rect x="69" y="274" width="2" height="14"/><rect x="74" y="274" width="4" height="14"/>
        <rect x="81" y="274" width="1.5" height="14"/><rect x="86" y="274" width="2.5" height="14"/>
      </g>
    </g>

    <!-- Green rubber stamp, rotated like it was pressed on by hand -->
    <g transform="translate(662 296) rotate(-9)">
      <rect x="0" y="0" width="196" height="54" rx="3" fill="none" stroke="#274D40" stroke-width="3.5" opacity="0.92"/>
      <rect x="7" y="7" width="182" height="40" rx="2" fill="none" stroke="#274D40" stroke-width="1.5" opacity="0.55"/>
      <text x="98" y="35" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="17"
            font-weight="700" letter-spacing="3.5" fill="#274D40" text-anchor="middle" opacity="0.92">SETTLED</text>
    </g>

    <!-- Perforated bottom edge -->
    <path d="M0 414 H1280" stroke="#D8D4C8" stroke-width="1.5" stroke-dasharray="7 5" fill="none"/>
  </g>
</svg>
